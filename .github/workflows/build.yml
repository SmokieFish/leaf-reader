name: Android build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect public files and history
        run: python3 scripts/check_public_files.py
      - name: Download verified build tools
        run: python3 android-toolchain/setup.py
      - name: Build unsigned APK
        run: bash leaf-android/build.sh
      - name: Run synthetic regression tests
        run: bash leaf-android/test.sh
